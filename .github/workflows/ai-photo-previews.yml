name: Generate AI-readable previews
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow pillow-heif
      - name: Generate text-based previews for AI
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, sys
          from pathlib import Path
          from PIL import Image, ImageOps
          from pillow_heif import register_heif_opener
          register_heif_opener()
          root = Path.cwd()
          destroot = root/'ai-previews'
          destroot.mkdir(exist_ok=True)
          manifest = destroot/'index.json'
          try:
              old = json.loads(manifest.read_text('utf-8'))
          except (OSError, ValueError):
              old = {}
          items = {}
          extensions = {'.jpg','.jpeg','.png','.webp','.heic','.heif'}
          ignore = {'.git','.github','ai-previews','node_modules'}
          for source in sorted(root.rglob('*')):
              if not source.is_file() or source.suffix.lower() not in extensions: continue
              rel = source.relative_to(root)
              if set(rel.parts) & ignore: continue
              key = rel.as_posix()
              sha = hashlib.sha256(source.read_bytes()).hexdigest()
              out = destroot/rel.parent/(rel.name+'.b64')
              jpg = destroot/rel.parent/(rel.name+'.preview.jpg')
              if old.get(key,{}).get('sha256') == sha and out.exists() and jpg.exists():
                  items[key] = old[key]
                  continue
              try:
                  with Image.open(source) as raw:
                      im = ImageOps.exif_transpose(raw).convert('RGB')
                  original_size = list(im.size)
                  edge, quality = 1600, 82
                  while True:
                      small = im.copy()
                      small.thumbnail((edge,edge), Image.Resampling.LANCZOS)
                      memory = io.BytesIO()
                      small.save(memory,'JPEG',quality=quality,optimize=True,progressive=True)
                      data = memory.getvalue()
                      if len(data)<550000 or edge<=650: break
                      if quality>65: quality-=7
                      else: edge=int(edge*0.82)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_text(base64.b64encode(data).decode('ascii'), encoding='ascii')
                  jpg.write_bytes(data)
                  items[key] = {'sha256':sha,'original':key,'preview':out.relative_to(root).as_posix(),
                                'preview_jpeg':jpg.relative_to(root).as_posix(),
                                'preview_sha256':hashlib.sha256(data).hexdigest(),
                                'original_dimensions':original_size,'preview_dimensions':list(small.size),
                                'preview_bytes':len(data)}
                  print(key, '=>', out.relative_to(root), len(data))
              except Exception as e:
                  print('Preview failed:',key,str(e),file=sys.stderr)
          manifest.write_text(json.dumps(items,ensure_ascii=False,indent=2)+'\n', encoding='utf-8')
          # GitHub renders each pair side by side. Preview is generated directly from the original.
          verify = ['# Original vs AI preview', '',
                    'Each preview is generated by resizing its corresponding source file (no generative editing).',
                    'The SHA-256 in index.json verifies the exact source bytes used. Open links to compare.', '',
                    '| Original | Generated preview |',
                    '| --- | --- |']
          from urllib.parse import quote
          for key, info in list(items.items())[:50]:
              origpath = quote('../'+key, safe='/')
              prevpath = quote(info['preview_jpeg'].removeprefix('ai-previews/'), safe='/')
              verify.append(f'| **{key}**<br><img src="{origpath}" width="300"> | **Preview**<br><img src="{prevpath}" width="300"> |')
          (destroot/'VERIFY.md').write_text('\n'.join(verify)+'\n', encoding='utf-8')
          print('Indexed',len(items),'photos')
          PY
      - name: Commit previews without changing originals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-previews
          if ! git diff --cached --quiet; then
            git commit -m 'Generate AI photo previews [skip ci]'
            git push
          fi
